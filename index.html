<!doctype html>
<html lang="de">
<head>
<title>Vorratsplaner</title>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'; worker-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Notvorrat planen nach BBK-Empfehlung: Reichweite in Tagen, Einkaufsliste, MHD-Warnungen. Offline, ohne Konto.">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: eine Spalte wie ein Regal-Etikett – Ziel oben, Kisten-Kacheln darunter, Details als eigene Ansicht */
:root{
  --bg:#ddcaa6; --paper:#f5ecda; --ink:#2a2217; --muted:#5a4c36; --line:#c9b48d;
  --olive:#4b5724; --olive-ink:#f5ecda; --rust:#ad4f26; --btn:#ad4f26; --danger:#9a3426;
  --ok:#376020; --warn:#c0861a; --warn-t:#744c00; --bad:#9a3426; --track:#e3d5bb;
  --f-display:"Roboto Condensed","sans-serif-condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --f-body:system-ui,Roboto,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1712; --paper:#28221a; --ink:#efe4cf; --muted:#b2a385; --line:#45392a;
  --olive:#97a75a; --olive-ink:#1b1712; --rust:#e07c4a; --btn:#a8481e; --danger:#a8352a;
  --ok:#8cc05e; --warn:#e5ab42; --warn-t:#e5ab42; --bad:#e8644f; --track:#3a3125; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1712; --paper:#28221a; --ink:#efe4cf; --muted:#b2a385; --line:#45392a;
  --olive:#97a75a; --olive-ink:#1b1712; --rust:#e07c4a; --btn:#a8481e; --danger:#a8352a;
  --ok:#8cc05e; --warn:#e5ab42; --warn-t:#e5ab42; --bad:#e8644f; --track:#3a3125; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
html{font-size:106.25%}
html.big{font-size:125%}
body{font-family:var(--f-body);font-size:1rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,.display{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
h1{font-size:clamp(1.45rem,7vw,2.1rem);text-transform:uppercase;min-width:0;overflow-wrap:break-word;hyphens:auto}
h2{overflow-wrap:break-word;hyphens:auto}
h2{font-size:1.45rem;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:.93rem}
.num{font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.iconbtn{display:inline-grid;place-items:center;width:48px;height:48px;flex:none;border-radius:12px;border:1.5px solid var(--line);background:var(--paper)}
.iconbtn svg{width:22px;height:22px}
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.stepper button{width:48px;height:48px;border:0;background:transparent;font-size:1.3rem;font-weight:700}
.stepper button:hover{background:var(--track)}
.stepper span{min-width:3.2ch;text-align:center;font-weight:700}
input[type=range]{width:100%;accent-color:var(--rust);height:32px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:9px 16px;min-height:44px;font-weight:700}
.chip[aria-pressed=true]{background:var(--olive);border-color:var(--olive);color:var(--olive-ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:14px;padding:4px;background:var(--paper);gap:4px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--paper)}
.band{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border:1.5px solid}
.band.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--paper))}
.band.info{border-color:var(--olive);background:color-mix(in srgb,var(--olive) 12%,var(--paper))}
.band b{display:block}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;font-weight:700;color:var(--ink)}
.hero{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:140px;height:140px}
.ring svg{width:140px;height:140px;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .big{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:.9}
.verdict{font-size:1.05rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.tile:hover{border-color:var(--muted)}
.tile .head{display:flex;align-items:center;gap:8px}
.tile .head svg{width:26px;height:26px;flex:none;color:var(--olive)}
.tile .name{font-weight:700;line-height:1.15}
.tile .val{font-size:.9rem;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.s-bad{background:var(--bad)} .s-warn{background:var(--warn)} .s-ok{background:var(--ok)}
.t-bad{color:var(--bad)} .t-warn{color:var(--warn-t)} .t-ok{color:var(--ok)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.875rem;color:var(--muted);align-items:center}
.item .actions{display:flex;gap:6px;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.pill.expired{border-color:var(--bad);color:var(--bad)}
.pill.soon{border-color:var(--warn);color:var(--warn-t)}
.pill.demo{border-style:dashed}
.del{width:48px;height:48px;border-radius:10px;border:0;background:transparent;color:var(--muted)}
.del:hover{color:var(--bad);background:var(--track)}
.del svg{width:20px;height:20px}
.primary{border:0;background:var(--btn);color:#fff;font-weight:700;border-radius:12px;padding:12px 18px;min-height:48px}
.secondary{border:1.5px solid var(--line);background:var(--paper);font-weight:700;border-radius:12px;padding:11px 16px;min-height:48px}
.danger{border:0;background:var(--danger);color:#fff;font-weight:700;border-radius:12px;padding:11px 16px}
.shop{display:flex;flex-direction:column;gap:2px}
.shop .line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--line)}
.shop .line:first-of-type{border-top:0}
.shop .line > span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.shop .line > span:last-child{flex:none;font-weight:700;white-space:nowrap;text-align:right}
.shop .line .small{display:block;margin-top:2px;line-height:1.35}
.done{color:var(--ok);font-weight:700}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:700;font-size:.9rem}
.field input,.field select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);min-width:0;width:100%}
.hint{font-size:.9rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:18px}}
.err{color:var(--bad);font-weight:700;font-size:.9rem}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.lead{font-size:1.05rem;margin:0;max-width:60ch}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;gap:16px;align-items:center;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:18px}
.choice:hover{border-color:var(--olive)}
.choice-ico{flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:16px;background:var(--olive);color:var(--olive-ink)}
.choice-ico svg{width:34px;height:34px}
.choice-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.ct{font-family:var(--f-display);font-weight:800;font-size:1.7rem;text-transform:uppercase;line-height:1}
.choice-fact{font-weight:700}
.print-only{display:none}
@media print{
  body{background:#fff!important;color:#000!important;padding:0}
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%;border:0;background:#fff;color:#000}
  .no-print{display:none!important}
  .print-only{display:block}
  .shop .line{border-color:#999;break-inside:avoid}
  .done,.muted,.label{color:#000!important}
  body.pinv .app{display:none!important}
  body.pinv #printout{display:block!important;visibility:visible}
  body.pinv #printout *{visibility:visible}
}
#printout{display:none;font:11pt/1.35 system-ui,Roboto,Arial,sans-serif;color:#000;background:#fff}
#printout h1{font-size:18pt;margin:0 0 2pt;text-transform:none}
#printout h2{font-size:12.5pt;margin:14pt 0 4pt;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5pt solid #000;padding-bottom:2pt}
#printout h3{font-size:11pt;margin:8pt 0 3pt}
#printout table{width:100%;border-collapse:collapse;margin:0 0 4pt;table-layout:fixed}
#printout th:first-child{width:16pt}
#printout .t6 th.n{width:12%} #printout .t6 th.n:last-child{width:22%} #printout .t6 td:last-child{white-space:normal}
#printout h2,#printout h3{break-after:avoid}
#printout .t4 th.n:nth-child(3){width:12%} #printout .t4 th.n:nth-child(4){width:30%}
#printout th,#printout td{border-bottom:.5pt solid #999;padding:3pt 4pt;text-align:left;vertical-align:top}
#printout th{font-size:9pt;text-transform:uppercase;letter-spacing:.03em}
#printout td.n,#printout th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#printout .box{display:inline-block;width:9pt;height:9pt;border:1pt solid #000;vertical-align:-1pt}
#printout .meta{font-size:9.5pt;color:#333}
#printout .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6pt;margin:8pt 0}
#printout .sum div{border:1pt solid #000;padding:4pt 6pt}
#printout .sum b{display:block;font-size:13pt}
#printout section,#printout tr{break-inside:avoid}
#printout .exp{font-weight:700}
@page{margin:14mm}
.subitem{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0}
.list .subitem:first-child{border-top:0}
.open{font-weight:700;color:var(--rust);white-space:nowrap}
.tick,.na{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.tick[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.na{color:var(--muted)}
.na[aria-pressed=true]{background:var(--track);color:var(--ink);border-style:dashed}
@media (max-width:420px){.item{grid-template-columns:1fr}.item .actions{justify-content:flex-start}}
.rot-entry{padding:14px}
.rot-entry .choice-ico{width:52px;height:52px}
.rotlist{display:flex;flex-direction:column}
.rot .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.875rem;color:var(--muted);align-items:center}
.rot{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.rotlist .rot:first-child{border-top:0;padding-top:0}
.rot-form{display:flex;flex-direction:column;gap:8px;background:var(--track);border-radius:12px;padding:12px}
.rot-form select{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--paper)}
.filebtn{display:inline-block;text-align:center;cursor:pointer}
details summary{cursor:pointer;color:var(--muted);font-weight:700}
.band.backup{border-color:var(--olive)}
.primary svg{width:18px;height:18px;vertical-align:-3px;margin-right:4px}
.check{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--olive);flex:none}
.btnlink{display:inline-block;text-decoration:none;text-align:center}
.whatsnew{display:block;font-size:.9rem;color:var(--muted);text-decoration:none;padding:4px 2px;line-height:1.45}
.whatsnew b{color:var(--ink)}
.newdot{display:inline-block;background:var(--btn);color:#fff;font-weight:700;font-size:.75rem;letter-spacing:.03em;border-radius:6px;padding:1px 7px;margin-right:4px}
.choice.sos .choice-ico{background:var(--btn);color:#fff}
.notruf{border-color:var(--rust)}
.nlist{display:flex;flex-direction:column}
.nrow{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.nlist .nrow:first-child{border-top:0;padding-top:0}
.nnum{font-family:var(--f-display);font-weight:800;font-size:1.35rem;color:var(--rust);line-height:1.1;overflow-wrap:anywhere}
.wsec{font-size:1.2rem;margin-top:8px}
#wlist{display:flex;flex-direction:column;gap:8px}
.wcard{background:var(--paper);border:1.5px solid var(--line);border-radius:14px}
.wcard summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;font-weight:700;cursor:pointer}
.wcard summary::-webkit-details-marker{display:none}
.wcard .chev{transition:transform .2s;color:var(--muted);font-size:1.3rem}
.wcard[open] .chev{transform:rotate(90deg)}
.wcard[open]{border-color:var(--olive)}
.wbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.wmore ul{margin:4px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.gear{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gchip{font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 9px;border:1.5px solid}
.gchip.ok{color:var(--ok);border-color:var(--ok)} .gchip.no{color:var(--bad);border-color:var(--bad)}
#printout .pw{break-inside:avoid;margin-bottom:6pt}
#printout .pw ol,#printout .pw ul{margin:2pt 0 2pt 14pt;padding:0}
#printout .pw li{margin:1pt 0}
footer .brand{display:block;margin-top:10px;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
.petcheck{border-color:var(--olive)}
.petcheck input{width:24px;height:24px}
.petbox{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--olive) 10%,var(--paper));border:1.5px solid var(--olive)}
.big.primary,.big.secondary{font-size:1.08rem;padding:14px 20px;min-height:56px}
.addbig{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.addbig svg,.big svg{width:22px;height:22px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:8px}
.qbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;min-height:56px;font-weight:700;text-align:left;line-height:1.25}
.qbtn:hover,.qbtn:focus-visible{border-color:var(--olive)}
.stepper.big button{width:56px;height:56px;font-size:1.5rem}
.stepper.big span{font-size:1.3rem;min-width:3ch}
.obdots{display:flex;gap:6px;justify-content:center}
.obdots span{width:34px;height:6px;border-radius:3px;background:var(--line)}
.obdots span.on{background:var(--olive)}
.obnav{justify-content:flex-end}
.obnav .primary{flex:1}
.check input{width:24px;height:24px}
.ct{overflow-wrap:break-word;hyphens:auto;font-size:clamp(1.3rem,6.5vw,1.7rem)}
.choice-txt,.choice-txt *{min-width:0;overflow-wrap:break-word;hyphens:auto}
.nrow{grid-template-columns:minmax(0,6.5em) minmax(0,1fr)!important}
.nrow > span{min-width:0;overflow-wrap:break-word;hyphens:auto}
@media (max-width:380px){.choice{gap:12px;padding:14px}.choice-ico{width:52px;height:52px}.choice-ico svg{width:28px;height:28px}}
.goal{border-color:var(--olive)}
.goal.cele{background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.cheer{font-size:1.05rem}
.miles{display:flex;align-items:flex-start;gap:6px}
.mile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;flex:none;min-width:4.2rem}
.mdot{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums;background:var(--paper)}
.mile.done .mdot{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.mline{flex:1;height:2px;background:var(--line);margin-top:1.3rem;min-width:8px}
.primary svg{vertical-align:-4px}
.secondary.btnlink{color:var(--ink)} .primary.btnlink{color:#fff}
.hint{overflow-wrap:anywhere}
footer{font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.bar i,.ring circle{transition:all .35s ease}}
</style>
</head>
<body>

<div class="app" id="app"></div>
<div id="printout" aria-hidden="true"></div>


<script src="app.js"></script>
</body>
